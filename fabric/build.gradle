plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

def protocolVersion = protocols_use_local_build == "true" ? protocols_local_version : protocols_version

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    api("me.shedaniel.cloth:cloth-config-fabric:${clothconfig_version}")

    implementation("com.github.NiFeather:feathermorph-protocols:$protocolVersion")
    api("com.terraformersmc:modmenu:${modmenu_version}")

    implementation("com.github.NiFeather:feathermorph-command-compat-layer:${compat_layer_version}")
    include("com.github.NiFeather:feathermorph-command-compat-layer:${compat_layer_version}")

    include("com.github.NiFeather:feathermorph-protocols:${protocolVersion}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// The probe is a separate mod used only by the isolated 26.2 validation runner.
def compileUpgradeClientProbe = tasks.register('compileUpgradeClientProbe', JavaCompile) {
    dependsOn tasks.named('classes')
    source rootProject.file('validation/26.2/client')
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDirectory = layout.buildDirectory.dir('validation/probe-classes')
    options.release = 25
}

tasks.register('upgradeClientProbeJar', Jar) {
    dependsOn compileUpgradeClientProbe
    from compileUpgradeClientProbe.flatMap { it.destinationDirectory }
    from rootProject.file('validation/26.2/client/fabric.mod.json')
    archiveFileName = 'FeatherMorphClientUpgradeProbe.jar'
    destinationDirectory = layout.buildDirectory.dir('validation')
}

tasks.register('prepareUpgradeClientRuntime') {
    dependsOn tasks.named('downloadAssets'), tasks.named('upgradeClientProbeJar')
    def runtimeFile = layout.buildDirectory.file('validation/runtime.json')
    outputs.file runtimeFile
    doLast {
        runtimeFile.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                classpath: configurations.runtimeClasspath.files.collect { it.absolutePath },
                assetsDir: new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/assets').absolutePath
        ]))
    }
}
